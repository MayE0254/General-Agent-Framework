<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MultiAgent 中台控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23409eff'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/console/vendor/element-plus.css" />
  <link rel="stylesheet" href="/console/vendor/element-plus.dark.css" />
  <link rel="stylesheet" href="/console/css/app.css" />
  <script>
    // 在首帧前应用持久化主题，避免亮/暗闪屏。
    (function () {
      var saved = localStorage.getItem("console-theme");
      if (saved === "dark") document.documentElement.classList.add("dark");
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <script src="/console/vendor/vue.global.prod.js"></script>
  <script src="/console/vendor/vue-router.global.prod.js"></script>

  <script src="/console/vendor/element-plus.locale.zh-cn.min.js"></script>
  <script src="/console/vendor/element-plus.icons.min.js"></script>
  <script type="module" src="/console/js/app.js"></script>
</body>
</html>
